# wall_ai's own rules for routes a target exposes and HTTP calls it makes.
# Kept in-repo on purpose: Semgrep's registry rules carry a restrictive license.
rules:
  - id: route.python.fastapi
    languages: [python]
    severity: INFO
    message: "$METHOD $PATH $FUNC"
    patterns:
      - pattern: |
          @$APP.$METHOD("$PATH", ...)
          def $FUNC(...): ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete)$

  - id: route.js.express
    languages: [typescript, javascript]
    severity: INFO
    message: "$METHOD $PATH"
    patterns:
      - pattern: $APP.$METHOD("$PATH", ..., $HANDLER)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete)$

  - id: http.python.client
    languages: [python]
    severity: INFO
    message: "$METHOD $URL"
    patterns:
      - pattern: $CLIENT.$METHOD("$URL", ...)
      - metavariable-regex:
          metavariable: $CLIENT
          regex: ^(httpx|requests)$
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|request)$

  - id: http.js.axios
    languages: [typescript, javascript]
    severity: INFO
    message: "$METHOD $URL"
    patterns:
      - pattern: axios.$METHOD("$URL", ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete)$

  - id: http.js.fetch
    languages: [typescript, javascript]
    severity: INFO
    message: "fetch $URL"
    pattern: fetch("$URL", ...)
