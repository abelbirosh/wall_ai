[project]
name = "wall-ai"
version = "0.0.1"
description = "Understand, secure and safeguard existing software systems."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.scripts]
wall-ai = "wall_ai.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wall_ai"]

[tool.ruff]
line-length = 100
extend-exclude = ["samples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["functional: runs external tools (semgrep, cdxgen) against a sample target"]
